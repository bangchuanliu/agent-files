<!doctype html><html lang="en"><head><meta charset="utf-8"><title>History</title><style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--filled:#3fb950;--empty:#484f58}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:32px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:15px;margin:28px 0 8px;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 20px;font-size:13px}
table{border-collapse:collapse;width:100%;max-width:1120px;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:8px}
thead th{text-align:left;padding:9px 14px;background:#1c2128;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
tbody td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#1c2128}
.col-word,.col-orig{font-weight:600;color:var(--accent);white-space:nowrap}
.col-syn{color:var(--muted)}
.col-syn.empty{opacity:.45}
.col-example,.col-native{font-style:italic;color:#c9d1d9}
.count{font-size:11px;color:#d29922;font-weight:600;margin-left:5px}
.col-progress{white-space:nowrap;font-size:15px;letter-spacing:2px}
.filled{color:var(--filled)}.empty{color:var(--empty)}
.col-notes ul{margin:0;padding-left:16px}.col-notes li{margin:2px 0}
.col-graduated{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
select.prog{background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:14px;letter-spacing:2px;cursor:pointer}
#toast{position:fixed;bottom:24px;right:24px;background:#238636;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;font-size:13px}
#toast.show{opacity:1}
</style></head>
<body>
<h1>History</h1>
<p class="sub">Graduated entries (●●●●● reached)</p>
<h2>Verbs</h2>
<table><thead><tr><th>Verb</th><th>Meaning</th><th>Synonyms</th><th>Example</th><th>Graduated</th></tr></thead>
<tbody>
      <!-- Append <tr> rows here when a verb graduates -->
    </tbody></table>
<h2>Words</h2>
<table><thead><tr><th>Word / Phrase</th><th>Meaning</th><th>Synonyms</th><th>Example</th><th>Graduated</th></tr></thead>
<tbody>
      <!-- Append <tr> rows here when a word graduates -->
    </tbody></table>
<h2>Sentences</h2>
<table><thead><tr><th>Your sentence</th><th>Native rewrite</th><th>Style notes</th><th>Graduated</th></tr></thead>
<tbody>
      <!-- Append <tr> rows here when a sentence graduates -->
    </tbody></table>
<div id="toast"></div>
<script>
(function(){
  if(!/^https?:$/.test(location.protocol))return;            // read-only on file://
  var file=location.pathname.split('/').pop();
  function toast(m,ok){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.style.background=ok?'#238636':'#da3633';t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1600);}
  document.querySelectorAll('td.col-progress').forEach(function(cell){
    var f=cell.querySelector('.filled');var n=f?f.textContent.length:0;
    var key=cell.closest('tr').querySelector('.col-word,.col-orig');
    if(!key)return;var item=key.firstChild.textContent.trim();
    var sel=document.createElement('select');sel.className='prog';
    [0,1,2,3,4,5].forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent='\u25cf'.repeat(v)+'\u25cb'.repeat(5-v);if(v===n)o.selected=true;sel.appendChild(o);});
    var g=document.createElement('option');g.value='grad';g.textContent='\u25cf\u25cf\u25cf\u25cf\u25cf \ud83c\udf93';sel.appendChild(g);
    sel.addEventListener('change',function(){
      var prog=sel.value==='grad'?5:parseInt(sel.value,10);
      fetch('/update-progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:file,item:item,progress:prog})})
        .then(function(r){return r.json()}).then(function(d){
          if(d.status==='ok'){toast(d.message||'saved',true);if(sel.value==='grad'){var tr=sel.closest('tr');tr.style.transition='opacity .4s';tr.style.opacity='0';setTimeout(function(){tr.remove()},420);}}
          else toast(d.message||'error',false);
        }).catch(function(){toast('save failed',false)});
    });
    cell.textContent='';cell.appendChild(sel);
  });
})();
</script>
</body></html>
